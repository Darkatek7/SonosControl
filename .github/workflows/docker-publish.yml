name: Docker publish

# Shared by Dockerhub (main), Dockerhub Nightly and Release; callers decide when CI has passed.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or release tag to build.
        required: true
        type: string
      channel:
        description: "release (vX.Y.Z tag), main (latest) or nightly (nightly)."
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      -
        name: Resolve version and tags
        id: version
        env:
          REF: ${{ inputs.ref }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            release)
              if [[ ! "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::Release tags must look like v1.2.3 or v1.2.3-rc.1, got '$REF'."
                exit 1
              fi
              version="${REF#v}"
              tags="type=raw,value=$version"
              # Prereleases get only their exact tag; stable releases also move X.Y and X.
              if [ -z "${BASH_REMATCH[4]}" ]; then
                tags+=$'\n'"type=raw,value=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                tags+=$'\n'"type=raw,value=${BASH_REMATCH[1]}"
              fi
              ;;
            main|nightly)
              # Between releases: last release plus commits since, e.g. 1.2.0-main.4.
              if last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null); then
                count=$(git rev-list --count "$last..HEAD")
              else
                last=v0.0.0
                count=$(git rev-list --count HEAD)
              fi
              version="${last#v}"
              if [ "$count" -gt 0 ]; then version="$version-$CHANNEL.$count"; fi
              if [ "$CHANNEL" = main ]; then tags="type=raw,value=latest"; else tags="type=raw,value=nightly"; fi
              ;;
            *)
              echo "::error::Unknown channel '$CHANNEL'."
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $version with tags: $(echo "$tags" | sed 's/type=raw,value=//' | paste -sd ' ')"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: darkatek7/sonoscontrol
          flavor: latest=false
          tags: ${{ steps.version.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ steps.version.outputs.revision }}
      -
        name: FlyDJ image metadata
        id: flydj-meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: darkatek7/sonoscontrol-flydj
          flavor: latest=false
          tags: ${{ steps.version.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
      -
        name: Build and push FlyDJ sidecar
        uses: docker/build-push-action@v7
        with:
          context: ./flydj
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.flydj-meta.outputs.tags }}
          labels: ${{ steps.flydj-meta.outputs.labels }}
