name: Docs Quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Repository guidance covers unified schedule/template editing, room stop rules, playback snapshots and the shared sleep timer.
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 README.md "docs/**/*.md" "flydj/*.md" CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md SECURITY.md AGENTS.md SonosControl.Web/wwwroot/css/README.md

      # Files are listed explicitly so an unexpanded glob cannot silently pass the link check.
      - name: Markdown link validation
        run: python scripts/check_markdown_links.py README.md docs flydj/API.md flydj/NOTICE.md flydj/README.md CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md SECURITY.md AGENTS.md SonosControl.Web/wwwroot/css/README.md
