services:
  sonos:
    container_name: sonoscontrol
    build:
      context: .
      dockerfile: Dockerfile
    image: sonoscontrol:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Vienna}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      Playback__PublicBaseUrl: ${PLAYBACK_PUBLIC_BASE_URL:-http://192.168.1.50:8080}
      Playback__ArtifactDirectory: /app/artifacts/youtube-audio
      Playback__SessionTtlMinutes: ${PLAYBACK_SESSION_TTL_MINUTES:-30}
      SonosEvents__Enabled: ${SONOS_EVENTS_ENABLED:-true}
      SonosEvents__CallbackBaseUrl: ${SONOS_EVENTS_CALLBACK_BASE_URL:-}
      ConnectionStrings__DefaultConnection: Data Source=/app/Data/app.db
      ASPNETCORE_URLS: http://+:8080
      DataProtection__KeysDirectory: /app/DataProtectionKeys
      FlyDj__Enabled: ${FLYDJ_ENABLED:-false}
      FlyDj__ServiceUrl: http://flydj:8090
      FlyDj__SharedSecret: ${FLYDJ_SHARED_SECRET:-}
    volumes:
      - ./Data:/app/Data
      - ./DataProtectionKeys:/app/DataProtectionKeys
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  flydj:
    container_name: sonoscontrol-flydj
    build:
      context: ./flydj
      dockerfile: Dockerfile
    image: sonoscontrol-flydj:local
    restart: on-failure
    expose:
      - "8090"
    environment:
      TZ: ${TZ:-Europe/Vienna}
      FLYDJ_ENABLED: ${FLYDJ_ENABLED:-false}
      FLYDJ_CONNECTOME_SCOPE: ${FLYDJ_CONNECTOME_SCOPE:-auditory}
      FLYDJ_SIM_SPEED: ${FLYDJ_SIM_SPEED:-1.0}
      FLYDJ_SHARED_SECRET: ${FLYDJ_SHARED_SECRET:-}
    cpus: ${FLYDJ_CPUS:-1.0}
    mem_limit: ${FLYDJ_MEM_LIMIT:-512m}
